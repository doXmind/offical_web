<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760">
  <defs>
    <style>
      .light { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 300; }
      .regular { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; }
      .medium { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .bold { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- White background -->
  <rect width="1270" height="760" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="635" y="52" text-anchor="middle" class="bold" font-size="30" fill="#111827" letter-spacing="-1">AI-Powered Analysis</text>

  <!-- App Window -->
  <g transform="translate(55, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="1160" height="580" rx="12" fill="#1C1C1E"/>

    <!-- Titlebar -->
    <rect x="0" y="0" width="1160" height="40" rx="12" fill="#28282C"/>
    <rect x="0" y="12" width="1160" height="28" fill="#28282C"/>
    <circle cx="20" cy="20" r="5.5" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="5.5" fill="#febc2e"/>
    <circle cx="60" cy="20" r="5.5" fill="#28c840"/>

    <!-- === LEFT: Outline Panel === -->
    <rect x="0" y="40" width="190" height="540" fill="#1C1C1E"/>
    <line x1="190" y1="40" x2="190" y2="580" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <text x="16" y="68" class="medium" font-size="10" fill="#636366" letter-spacing="1">OUTLINE</text>
    <g transform="translate(16, 84)">
      <rect x="-4" y="-4" width="170" height="20" rx="4" fill="rgba(255,255,255,0.04)"/>
      <text x="0" y="10" class="medium" font-size="11" fill="#AEAEB2">Customer Database Analysis</text>
      <text x="10" y="30" class="regular" font-size="10" fill="#636366">Dataset Overview</text>
      <text x="10" y="48" class="regular" font-size="10" fill="#636366">1. Customer Segment Distr.</text>
      <text x="10" y="66" class="regular" font-size="10" fill="#636366">2. Loyalty Points by Segment</text>
      <text x="10" y="84" class="regular" font-size="10" fill="#636366">3. Preferred Contact Method</text>
      <text x="10" y="102" class="regular" font-size="10" fill="#636366">4. Registration Trends</text>
      <text x="10" y="120" class="regular" font-size="10" fill="#636366">5. Geographic Distribution</text>
      <text x="10" y="138" class="regular" font-size="10" fill="#636366">Summary</text>
    </g>

    <!-- === CENTER: Document === -->
    <g transform="translate(210, 60)">
      <text x="30" y="24" class="bold" font-size="22" fill="#F2F2F7">Customer Database Analysis Report</text>

      <text x="30" y="60" class="bold" font-size="16" fill="#AEAEB2">Dataset Overview</text>

      <!-- Table: Overview -->
      <g transform="translate(30, 76)">
        <rect x="0" y="0" width="400" height="28" fill="rgba(255,255,255,0.03)"/>
        <text x="12" y="18" class="medium" font-size="10" fill="#8E8E93" letter-spacing="0.5">Metric</text>
        <text x="210" y="18" class="medium" font-size="10" fill="#8E8E93" letter-spacing="0.5">Value</text>
        <line x1="0" y1="28" x2="400" y2="28" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <text x="12" y="46" class="regular" font-size="11" fill="#8E8E93">Total Records</text>
        <text x="210" y="46" class="regular" font-size="11" fill="#8E8E93">10,000 customers</text>
        <line x1="0" y1="54" x2="400" y2="54" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <text x="12" y="72" class="regular" font-size="11" fill="#8E8E93">Columns</text>
        <text x="210" y="72" class="regular" font-size="11" fill="#8E8E93">14</text>
        <line x1="0" y1="80" x2="400" y2="80" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <text x="12" y="98" class="regular" font-size="11" fill="#8E8E93">Date Range</text>
        <text x="210" y="98" class="regular" font-size="11" fill="#8E8E93">2020-09-29 to 2025-09-29</text>
        <line x1="0" y1="106" x2="400" y2="106" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <text x="12" y="124" class="regular" font-size="11" fill="#8E8E93">Missing Values</text>
        <text x="210" y="124" class="regular" font-size="11" fill="#8E8E93">None</text>
      </g>

      <!-- Section 2 -->
      <text x="30" y="240" class="bold" font-size="16" fill="#AEAEB2">1. Customer Segment Distribution</text>

      <g transform="translate(30, 256)">
        <rect x="0" y="0" width="400" height="28" fill="rgba(255,255,255,0.03)"/>
        <text x="12" y="18" class="medium" font-size="10" fill="#8E8E93">Segment</text>
        <text x="180" y="18" class="medium" font-size="10" fill="#8E8E93">Count</text>
        <text x="300" y="18" class="medium" font-size="10" fill="#8E8E93">Percentage</text>
        <line x1="0" y1="28" x2="400" y2="28" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <text x="12" y="46" class="regular" font-size="11" fill="#8E8E93">Premium</text>
        <text x="180" y="46" class="regular" font-size="11" fill="#8E8E93">2,553</text>
        <text x="300" y="46" class="regular" font-size="11" fill="#8E8E93">25.5%</text>
        <line x1="0" y1="54" x2="400" y2="54" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <text x="12" y="72" class="regular" font-size="11" fill="#8E8E93">VIP</text>
        <text x="180" y="72" class="regular" font-size="11" fill="#8E8E93">2,493</text>
        <text x="300" y="72" class="regular" font-size="11" fill="#8E8E93">24.9%</text>
        <line x1="0" y1="80" x2="400" y2="80" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <text x="12" y="98" class="regular" font-size="11" fill="#8E8E93">New</text>
        <text x="180" y="98" class="regular" font-size="11" fill="#8E8E93">2,485</text>
        <text x="300" y="98" class="regular" font-size="11" fill="#8E8E93">24.8%</text>
        <line x1="0" y1="106" x2="400" y2="106" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <text x="12" y="124" class="regular" font-size="11" fill="#8E8E93">Regular</text>
        <text x="180" y="124" class="regular" font-size="11" fill="#8E8E93">2,469</text>
        <text x="300" y="124" class="regular" font-size="11" fill="#8E8E93">24.7%</text>
      </g>

      <!-- Key Finding -->
      <text x="30" y="426" class="medium" font-size="11" fill="#8E8E93">Key Finding:</text>
      <text x="110" y="426" class="regular" font-size="11" fill="#636366">Segments are nearly evenly distributed (~25% each).</text>

      <!-- Footer -->
      <text x="30" y="498" class="regular" font-size="10" fill="#48484A">Saved  ·  273 words  ·  2,254 characters  ·  2 min read</text>
    </g>

    <!-- === RIGHT: AI Chat Panel === -->
    <rect x="790" y="40" width="370" height="540" fill="#1C1C1E"/>
    <line x1="790" y1="40" x2="790" y2="580" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <text x="810" y="68" class="medium" font-size="13" fill="#8E8E93">AI Chat</text>

    <!-- User message -->
    <g transform="translate(810, 88)">
      <circle cx="10" cy="10" r="10" fill="#3b2a1a"/>
      <text x="10" y="14" text-anchor="middle" class="medium" font-size="9" fill="#fff">Y</text>
      <text x="28" y="14" class="medium" font-size="11" fill="#AEAEB2">You</text>
      <rect x="0" y="24" width="240" height="18" rx="4" fill="rgba(255,255,255,0.03)"/>
      <text x="8" y="37" class="regular" font-size="9" fill="#636366">Reference: database:07d90ffc-8973...</text>
      <text x="0" y="58" class="regular" font-size="13" fill="#AEAEB2">please analyze this database</text>
    </g>

    <!-- AI response -->
    <g transform="translate(810, 170)">
      <g transform="scale(0.35)">
        <path d="M3 0 Q0 0 0 3 L0 16 L20 20 L16 0 Z" fill="#AEAEB2"/>
        <path d="M24 0 L20 20 L40 16 L40 3 Q40 0 37 0 Z" fill="#AEAEB2"/>
        <path d="M0 24 L20 20 L16 40 L3 40 Q0 40 0 37 Z" fill="#AEAEB2"/>
        <path d="M20 20 L40 24 L40 37 Q40 40 37 40 L24 40 Z" fill="#AEAEB2"/>
      </g>
      <text x="22" y="12" class="medium" font-size="11" fill="#AEAEB2">doXmind</text>

      <text x="0" y="34" class="regular" font-size="12" fill="#AEAEB2">Done! I've analyzed the customer</text>
      <text x="0" y="50" class="regular" font-size="12" fill="#AEAEB2">database and created a report.</text>

      <text x="0" y="76" class="medium" font-size="12" fill="#AEAEB2">Key Insights:</text>

      <circle cx="5" cy="94" r="2.5" fill="#5AABCF" opacity="0.5"/>
      <text x="14" y="98" class="regular" font-size="11" fill="#8E8E93">10,000 customers, 14 columns</text>

      <circle cx="5" cy="118" r="2.5" fill="#5AABCF" opacity="0.5"/>
      <text x="14" y="122" class="regular" font-size="11" fill="#8E8E93">Even segment distribution:</text>
      <text x="14" y="136" class="regular" font-size="11" fill="#8E8E93">Premium 25.5%, VIP 24.9%</text>

      <circle cx="5" cy="156" r="2.5" fill="#5AABCF" opacity="0.5"/>
      <text x="14" y="160" class="regular" font-size="11" fill="#8E8E93">VIP highest loyalty (2,515 avg)</text>

      <circle cx="5" cy="180" r="2.5" fill="#5AABCF" opacity="0.5"/>
      <text x="14" y="184" class="regular" font-size="11" fill="#8E8E93">Email is #1 contact (34%)</text>

      <circle cx="5" cy="204" r="2.5" fill="#5AABCF" opacity="0.5"/>
      <text x="14" y="208" class="regular" font-size="11" fill="#8E8E93">Strong 2021 growth (2,045 reg.)</text>

      <circle cx="5" cy="228" r="2.5" fill="#5AABCF" opacity="0.5"/>
      <text x="14" y="232" class="regular" font-size="11" fill="#8E8E93">Balanced geographic distribution</text>
    </g>

    <!-- Thinking indicator -->
    <g transform="translate(810, 520)">
      <rect x="0" y="0" width="340" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <text x="14" y="22" class="regular" font-size="12" fill="#48484A">Ask AI anything, @ to mention file</text>
      <rect x="248" y="6" width="78" height="24" rx="12" fill="#D4A54A" opacity="0.12"/>
      <circle cx="264" cy="18" r="3.5" fill="#D4A54A" opacity="0.5"/>
      <text x="274" y="22" class="medium" font-size="10" fill="#D4A54A" opacity="0.8">Thinking</text>
    </g>
  </g>
</svg>


