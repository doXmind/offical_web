<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      .light { font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif; font-weight: 300; }
      .bold { font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif; font-weight: 900; }
      .medium { font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif; font-weight: 600; }
    </style>
    <linearGradient id="doxGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Deep dark background -->
  <rect width="1200" height="675" fill="#0a0a14"/>

  <!-- Large decorative shapes -->
  <circle cx="600" cy="380" r="350" fill="#0f0f24" opacity="0.6"/>
  <rect x="-50" y="400" width="250" height="400" rx="40" fill="#0d0d20" opacity="0.4" transform="rotate(-20, 75, 600)"/>
  <rect x="1020" y="350" width="250" height="400" rx="40" fill="#0d0d20" opacity="0.4" transform="rotate(15, 1145, 550)"/>

  <!-- Logo -->
  <g transform="translate(70, 50)">
    <path d="M3 0 Q0 0 0 3 L0 16 L20 20 L16 0 Z" fill="#FFFFFF"/>
    <path d="M24 0 L20 20 L40 16 L40 3 Q40 0 37 0 Z" fill="#FFFFFF"/>
    <path d="M0 24 L20 20 L16 40 L3 40 Q0 40 0 37 Z" fill="#FFFFFF"/>
    <path d="M20 20 L40 24 L40 37 Q40 40 37 40 L24 40 Z" fill="#FFFFFF"/>
    <text x="52" y="30" fill="#FFFFFF" font-size="24" letter-spacing="-1">
      <tspan class="light">do</tspan><tspan class="bold">X</tspan><tspan class="light">mind</tspan>
    </text>
  </g>

  <!-- === 3 Product Cards === -->

  <!-- CARD LEFT: Notion (receded, behind, rotated slightly) -->
  <g transform="translate(40, 130) rotate(-3, 175, 220)">
    <rect x="0" y="0" width="350" height="440" rx="20" fill="#0e0e1c" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="175" y="48" text-anchor="middle" class="medium" font-size="20" fill="rgba(255,255,255,0.4)">Notion</text>
    <text x="175" y="72" text-anchor="middle" class="light" font-size="13" fill="rgba(255,255,255,0.15)">Workspace + Wiki</text>
    <line x1="35" y1="92" x2="315" y2="92" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <!-- Features with X marks -->
    <g transform="translate(45, 115)">
      <text x="0" y="0" class="light" font-size="14" fill="rgba(255,255,255,0.25)">AI Thinking Mode</text>
      <g transform="translate(245, -5)"><line x1="-4" y1="-4" x2="4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="-4" x2="-4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/></g>

      <text x="0" y="42" class="light" font-size="14" fill="rgba(255,255,255,0.25)">Inline Diff Review</text>
      <g transform="translate(245, 37)"><line x1="-4" y1="-4" x2="4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="-4" x2="-4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/></g>

      <text x="0" y="84" class="light" font-size="14" fill="rgba(255,255,255,0.25)">KB Agent</text>
      <g transform="translate(245, 79)"><line x1="-4" y1="-4" x2="4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="-4" x2="-4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/></g>

      <text x="0" y="126" class="light" font-size="14" fill="rgba(255,255,255,0.25)">CSV Analysis</text>
      <g transform="translate(245, 121)"><line x1="-4" y1="-4" x2="4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="-4" x2="-4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/></g>

      <text x="0" y="168" class="light" font-size="14" fill="rgba(255,255,255,0.25)">Presentation Mode</text>
      <g transform="translate(245, 163)"><line x1="-4" y1="-4" x2="4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="-4" x2="-4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/></g>

      <text x="0" y="210" class="light" font-size="14" fill="rgba(255,255,255,0.25)">Database Blocks</text>
      <g transform="translate(245, 205)"><path d="M-5,0 L-1.5,3.5 L5,-3.5" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" stroke-linecap="round"/></g>
    </g>

    <text x="175" y="395" text-anchor="middle" class="bold" font-size="32" fill="rgba(255,255,255,0.2)">1 / 6</text>
  </g>

  <!-- CARD CENTER: doXmind (front, elevated, glowing) -->
  <g transform="translate(390, 95)">
    <!-- Glow aura -->
    <rect x="-6" y="-6" width="432" height="512" rx="26" fill="none" stroke="url(#doxGlow)" stroke-width="3"/>
    <rect x="0" y="0" width="420" height="500" rx="20" fill="#0d0d1f" stroke="rgba(59,130,246,0.2)" stroke-width="1.5"/>
    <!-- Blue top bar -->
    <rect x="0" y="0" width="420" height="4" rx="2" fill="#3b82f6"/>

    <!-- Header with mini logo -->
    <g transform="translate(210, 38)">
      <g transform="translate(-10, -10) scale(0.5)">
        <path d="M3 0 Q0 0 0 3 L0 16 L20 20 L16 0 Z" fill="#FFFFFF"/>
        <path d="M24 0 L20 20 L40 16 L40 3 Q40 0 37 0 Z" fill="#FFFFFF"/>
        <path d="M0 24 L20 20 L16 40 L3 40 Q0 40 0 37 Z" fill="#FFFFFF"/>
        <path d="M20 20 L40 24 L40 37 Q40 40 37 40 L24 40 Z" fill="#FFFFFF"/>
      </g>
    </g>
    <text x="210" y="70" text-anchor="middle" font-size="22" fill="#FFFFFF">
      <tspan class="light">do</tspan><tspan class="bold">X</tspan><tspan class="light">mind</tspan>
    </text>
    <text x="210" y="92" text-anchor="middle" class="light" font-size="13" fill="rgba(255,255,255,0.4)">AI-Native Editor</text>
    <line x1="40" y1="112" x2="380" y2="112" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- All features checked — bright blue -->
    <g transform="translate(50, 135)">
      <text x="0" y="0" class="light" font-size="15" fill="rgba(255,255,255,0.85)">AI Thinking Mode</text>
      <g transform="translate(275, -5)"><path d="M-5,0 L-1.5,3.5 L5,-3.5" stroke="#3b82f6" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>

      <text x="0" y="46" class="light" font-size="15" fill="rgba(255,255,255,0.85)">Inline Diff Review</text>
      <g transform="translate(275, 41)"><path d="M-5,0 L-1.5,3.5 L5,-3.5" stroke="#3b82f6" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>

      <text x="0" y="92" class="light" font-size="15" fill="rgba(255,255,255,0.85)">KB Agent</text>
      <g transform="translate(275, 87)"><path d="M-5,0 L-1.5,3.5 L5,-3.5" stroke="#3b82f6" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>

      <text x="0" y="138" class="light" font-size="15" fill="rgba(255,255,255,0.85)">CSV Analysis</text>
      <g transform="translate(275, 133)"><path d="M-5,0 L-1.5,3.5 L5,-3.5" stroke="#3b82f6" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>

      <text x="0" y="184" class="light" font-size="15" fill="rgba(255,255,255,0.85)">Presentation Mode</text>
      <g transform="translate(275, 179)"><path d="M-5,0 L-1.5,3.5 L5,-3.5" stroke="#3b82f6" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>

      <text x="0" y="230" class="light" font-size="15" fill="rgba(255,255,255,0.85)">Database Blocks</text>
      <g transform="translate(275, 225)"><path d="M-5,0 L-1.5,3.5 L5,-3.5" stroke="#3b82f6" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
    </g>

    <text x="210" y="430" text-anchor="middle" class="bold" font-size="36" fill="#FFFFFF">6 / 6</text>
    <text x="210" y="460" text-anchor="middle" class="light" font-size="13" fill="#60a5fa">All features included</text>
  </g>

  <!-- CARD RIGHT: Google Docs (receded, behind, rotated) -->
  <g transform="translate(810, 130) rotate(3, 175, 220)">
    <rect x="0" y="0" width="350" height="440" rx="20" fill="#0e0e1c" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="175" y="48" text-anchor="middle" class="medium" font-size="20" fill="rgba(255,255,255,0.4)">Google Docs</text>
    <text x="175" y="72" text-anchor="middle" class="light" font-size="13" fill="rgba(255,255,255,0.15)">Word Processor</text>
    <line x1="35" y1="92" x2="315" y2="92" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <!-- All X marks -->
    <g transform="translate(45, 115)">
      <text x="0" y="0" class="light" font-size="14" fill="rgba(255,255,255,0.25)">AI Thinking Mode</text>
      <g transform="translate(245, -5)"><line x1="-4" y1="-4" x2="4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="-4" x2="-4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/></g>

      <text x="0" y="42" class="light" font-size="14" fill="rgba(255,255,255,0.25)">Inline Diff Review</text>
      <g transform="translate(245, 37)"><line x1="-4" y1="-4" x2="4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="-4" x2="-4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/></g>

      <text x="0" y="84" class="light" font-size="14" fill="rgba(255,255,255,0.25)">KB Agent</text>
      <g transform="translate(245, 79)"><line x1="-4" y1="-4" x2="4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="-4" x2="-4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/></g>

      <text x="0" y="126" class="light" font-size="14" fill="rgba(255,255,255,0.25)">CSV Analysis</text>
      <g transform="translate(245, 121)"><line x1="-4" y1="-4" x2="4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="-4" x2="-4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/></g>

      <text x="0" y="168" class="light" font-size="14" fill="rgba(255,255,255,0.25)">Presentation Mode</text>
      <g transform="translate(245, 163)"><line x1="-4" y1="-4" x2="4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="-4" x2="-4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/></g>

      <text x="0" y="210" class="light" font-size="14" fill="rgba(255,255,255,0.25)">Database Blocks</text>
      <g transform="translate(245, 205)"><line x1="-4" y1="-4" x2="4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="-4" x2="-4" y2="4" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/></g>
    </g>

    <text x="175" y="395" text-anchor="middle" class="bold" font-size="32" fill="rgba(255,255,255,0.2)">0 / 6</text>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="632" text-anchor="middle" class="bold" font-size="24" fill="#FFFFFF" letter-spacing="-1">AI-native from day one.</text>
  <text x="832" y="632" class="light" font-size="24" fill="rgba(255,255,255,0.3)"> Not bolted on.</text>
</svg>