<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760">
  <defs>
    <style>
      .light { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 300; }
      .regular { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; }
      .medium { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .bold { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1270" height="760" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="635" y="52" text-anchor="middle" class="bold" font-size="30" fill="#111827" letter-spacing="-1">Database Views</text>

  <!-- Two side-by-side windows -->

  <!-- === LEFT WINDOW: Gallery View === -->
  <g transform="translate(40, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="580" height="580" rx="12" fill="#1C1C1E"/>
    <rect x="0" y="0" width="580" height="36" rx="12" fill="#28282C"/>
    <rect x="0" y="12" width="580" height="24" fill="#28282C"/>
    <circle cx="18" cy="18" r="4.5" fill="#ff5f57"/>
    <circle cx="34" cy="18" r="4.5" fill="#febc2e"/>
    <circle cx="50" cy="18" r="4.5" fill="#28c840"/>

    <g transform="translate(24, 52)">
      <text x="0" y="16" class="bold" font-size="17" fill="#F2F2F7">Untitled Database</text>

      <!-- Gallery pill -->
      <rect x="0" y="28" width="66" height="24" rx="6" fill="#D4A54A" opacity="0.12"/>
      <text x="16" y="44" class="medium" font-size="11" fill="#D4A54A">Gallery</text>
      <text x="76" y="44" class="regular" font-size="14" fill="#48484A">+</text>

      <!-- Toolbar -->
      <text x="0" y="72" class="regular" font-size="11" fill="#636366">Filter</text>
      <text x="48" y="72" class="regular" font-size="11" fill="#636366">Sort</text>
      <text x="370" y="72" class="regular" font-size="11" fill="#636366">Analyze with AI</text>
      <text x="472" y="72" class="regular" font-size="11" fill="#636366">Properties</text>
      <line x1="0" y1="82" x2="530" y2="82" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

      <!-- 3 Gallery Cards -->
      <g transform="translate(0, 96)">
        <!-- Card 1 -->
        <rect x="0" y="0" width="168" height="150" rx="10" fill="#242428" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <rect x="1" y="1" width="166" height="82" rx="10" fill="#1E1E22"/>
        <rect x="68" y="24" width="28" height="34" rx="3" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
        <line x1="74" y1="34" x2="90" y2="34" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <line x1="74" y1="40" x2="90" y2="40" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="12" y="106" class="bold" font-size="13" fill="#E5E5EA">Task 1</text>
        <text x="12" y="126" class="regular" font-size="10" fill="#636366">Status</text>
        <text x="50" y="126" class="medium" font-size="10" fill="#8E8E93">To Do</text>

        <!-- Card 2 -->
        <g transform="translate(180, 0)">
          <rect x="0" y="0" width="168" height="150" rx="10" fill="#242428" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
          <rect x="1" y="1" width="166" height="82" rx="10" fill="#1E1E22"/>
          <rect x="68" y="24" width="28" height="34" rx="3" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
          <line x1="74" y1="34" x2="90" y2="34" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
          <line x1="74" y1="40" x2="90" y2="40" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
          <text x="12" y="106" class="bold" font-size="13" fill="#E5E5EA">Task 2</text>
          <text x="12" y="126" class="regular" font-size="10" fill="#636366">Status</text>
          <rect x="48" y="115" width="72" height="18" rx="4" fill="#5EC28A" opacity="0.12"/>
          <text x="58" y="128" class="medium" font-size="10" fill="#5EC28A">In Progress</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(360, 0)">
          <rect x="0" y="0" width="168" height="150" rx="10" fill="#242428" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
          <rect x="1" y="1" width="166" height="82" rx="10" fill="#1E1E22"/>
          <rect x="68" y="24" width="28" height="34" rx="3" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
          <line x1="74" y1="34" x2="90" y2="34" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
          <line x1="74" y1="40" x2="90" y2="40" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
          <text x="12" y="106" class="bold" font-size="13" fill="#E5E5EA">Task 3</text>
          <text x="12" y="126" class="regular" font-size="10" fill="#636366">Status</text>
          <rect x="48" y="115" width="44" height="18" rx="4" fill="#5EC28A" opacity="0.12"/>
          <text x="56" y="128" class="medium" font-size="10" fill="#5EC28A">Done</text>
        </g>
      </g>

      <!-- Add card placeholder -->
      <rect x="0" y="260" width="168" height="100" rx="10" fill="transparent" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="70" y="316" class="regular" font-size="14" fill="#3A3A3C">+</text>
    </g>
  </g>

  <!-- === RIGHT WINDOW: Board View === -->
  <g transform="translate(650, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="580" height="580" rx="12" fill="#1C1C1E"/>
    <rect x="0" y="0" width="580" height="36" rx="12" fill="#28282C"/>
    <rect x="0" y="12" width="580" height="24" fill="#28282C"/>
    <circle cx="18" cy="18" r="4.5" fill="#ff5f57"/>
    <circle cx="34" cy="18" r="4.5" fill="#febc2e"/>
    <circle cx="50" cy="18" r="4.5" fill="#28c840"/>

    <g transform="translate(24, 52)">
      <text x="0" y="16" class="bold" font-size="17" fill="#F2F2F7">Untitled Database</text>

      <!-- Board pill -->
      <rect x="0" y="28" width="58" height="24" rx="6" fill="#D4A54A" opacity="0.12"/>
      <text x="16" y="44" class="medium" font-size="11" fill="#D4A54A">Board</text>
      <text x="68" y="44" class="regular" font-size="14" fill="#48484A">+</text>

      <!-- Toolbar -->
      <text x="0" y="72" class="regular" font-size="11" fill="#636366">Filter</text>
      <text x="48" y="72" class="regular" font-size="11" fill="#636366">Sort</text>
      <text x="370" y="72" class="regular" font-size="11" fill="#636366">Analyze with AI</text>
      <text x="472" y="72" class="regular" font-size="11" fill="#636366">Properties</text>
      <line x1="0" y1="82" x2="530" y2="82" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

      <!-- 3 Kanban Columns -->
      <g transform="translate(0, 96)">
        <!-- Col 1: No Status -->
        <text x="0" y="12" class="bold" font-size="12" fill="#8E8E93">No Status</text>
        <rect x="72" y="0" width="20" height="16" rx="8" fill="rgba(255,255,255,0.05)"/>
        <text x="82" y="12" text-anchor="middle" class="regular" font-size="10" fill="#48484A">0</text>
        <rect x="0" y="26" width="165" height="40" rx="8" fill="#242428" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="68" y="50" class="regular" font-size="12" fill="#3A3A3C">+ New</text>

        <!-- Col 2: To Do -->
        <g transform="translate(180, 0)">
          <text x="0" y="12" class="bold" font-size="12" fill="#8E8E93">To Do</text>
          <rect x="42" y="0" width="20" height="16" rx="8" fill="rgba(255,255,255,0.05)"/>
          <text x="52" y="12" text-anchor="middle" class="regular" font-size="10" fill="#48484A">1</text>
          <rect x="0" y="26" width="165" height="40" rx="8" fill="#242428" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
          <text x="14" y="50" class="regular" font-size="12" fill="#AEAEB2">Task 1</text>
          <rect x="0" y="74" width="165" height="40" rx="8" fill="transparent" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
          <text x="68" y="98" class="regular" font-size="12" fill="#3A3A3C">+ New</text>
        </g>

        <!-- Col 3: In Progress -->
        <g transform="translate(360, 0)">
          <rect x="0" y="-2" width="78" height="18" rx="4" fill="#5EC28A" opacity="0.08"/>
          <text x="8" y="12" class="medium" font-size="11" fill="#5EC28A" opacity="0.7">In Progress</text>
          <rect x="86" y="0" width="20" height="16" rx="8" fill="rgba(255,255,255,0.05)"/>
          <text x="96" y="12" text-anchor="middle" class="regular" font-size="10" fill="#48484A">1</text>
          <rect x="0" y="26" width="165" height="40" rx="8" fill="#242428" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
          <text x="14" y="50" class="regular" font-size="12" fill="#AEAEB2">Task 2</text>
          <rect x="0" y="74" width="165" height="40" rx="8" fill="transparent" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
          <text x="68" y="98" class="regular" font-size="12" fill="#3A3A3C">+ New</text>
        </g>
      </g>
    </g>
  </g>
</svg>


