<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760">
  <defs>
    <style>
      .light { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 300; }
      .regular { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; }
      .medium { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .bold { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- White background -->
  <rect width="1270" height="760" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="635" y="52" text-anchor="middle" class="bold" font-size="30" fill="#111827" letter-spacing="-1">Inline AI Editing</text>

  <!-- Product UI Window -->
  <g transform="translate(75, 80)" filter="url(#shadow)">
    <!-- Window frame -->
    <rect x="0" y="0" width="1120" height="580" rx="12" fill="#1C1C1E"/>

    <!-- Window titlebar -->
    <rect x="0" y="0" width="1120" height="40" rx="12" fill="#28282C"/>
    <rect x="0" y="12" width="1120" height="28" fill="#28282C"/>
    <!-- Traffic lights -->
    <circle cx="20" cy="20" r="5.5" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="5.5" fill="#febc2e"/>
    <circle cx="60" cy="20" r="5.5" fill="#28c840"/>

    <!-- doXmind logo in titlebar center -->
    <g transform="translate(540, 8) scale(0.42)">
      <path d="M3 0 Q0 0 0 3 L0 16 L20 20 L16 0 Z" fill="#8E8E93"/>
      <path d="M24 0 L20 20 L40 16 L40 3 Q40 0 37 0 Z" fill="#8E8E93"/>
      <path d="M0 24 L20 20 L16 40 L3 40 Q0 40 0 37 Z" fill="#8E8E93"/>
      <path d="M20 20 L40 24 L40 37 Q40 40 37 40 L24 40 Z" fill="#8E8E93"/>
    </g>
    <text x="566" y="25" class="regular" font-size="12" fill="#636366">doXmind</text>

    <!-- Document content area -->
    <g transform="translate(80, 70)">
      <!-- Section title -->
      <text x="0" y="0" class="bold" font-size="22" fill="#F2F2F7">2.2 Data Flow Summary</text>

      <!-- Line 1 -->
      <g transform="translate(20, 44)">
        <circle cx="-12" cy="-4" r="2.5" fill="#48484A"/>
        <text x="0" y="0" class="regular" font-size="15" fill="#48484A" text-decoration="line-through">Input is tokenized and converted to embeddings</text>
        <rect x="-2" y="12" width="660" height="22" rx="3" fill="#5A92B0" opacity="0.12"/>
        <text x="0" y="28" class="regular" font-size="15" fill="#7ABADC">Your text gets broken into small pieces (called tokens) and turned into number representations</text>
      </g>

      <!-- Line 2 -->
      <g transform="translate(20, 114)">
        <circle cx="-12" cy="-4" r="2.5" fill="#48484A"/>
        <text x="0" y="0" class="regular" font-size="15" fill="#48484A" text-decoration="line-through">Positional encoding is added to give the model a sense of word order</text>
        <rect x="-2" y="12" width="610" height="22" rx="3" fill="#5A92B0" opacity="0.12"/>
        <text x="0" y="28" class="regular" font-size="15" fill="#7ABADC">Position information is added so the model knows which word comes first, second, and so on</text>
      </g>

      <!-- Line 3 -->
      <g transform="translate(20, 184)">
        <circle cx="-12" cy="-4" r="2.5" fill="#48484A"/>
        <text x="0" y="0" class="regular" font-size="15" fill="#48484A" text-decoration="line-through">The encoder processes the full input through N identical layers</text>
        <rect x="-2" y="12" width="660" height="22" rx="3" fill="#5A92B0" opacity="0.12"/>
        <text x="0" y="28" class="regular" font-size="15" fill="#7ABADC">The encoder reads through all these tokens and figures out how each word relates to every other word</text>
      </g>

      <!-- Line 4 -->
      <g transform="translate(20, 254)">
        <circle cx="-12" cy="-4" r="2.5" fill="#48484A"/>
        <text x="0" y="0" class="regular" font-size="15" fill="#48484A" text-decoration="line-through">The decoder generates output tokens one at a time, using step by step:</text>
        <rect x="-2" y="12" width="418" height="22" rx="3" fill="#5A92B0" opacity="0.12"/>
        <text x="0" y="28" class="regular" font-size="15" fill="#7ABADC">The decoder builds the output one at a time, step by step:</text>
      </g>

      <!-- Sub-bullets -->
      <g transform="translate(48, 314)">
        <text x="0" y="0" class="regular" font-size="14" fill="#48484A" text-decoration="line-through">- Masked self-attention over previously generated tokens</text>
        <rect x="-2" y="10" width="380" height="20" rx="3" fill="#5A92B0" opacity="0.12"/>
        <text x="0" y="25" class="regular" font-size="14" fill="#7ABADC">It looks at what words it has already generated</text>
      </g>

      <g transform="translate(48, 370)">
        <text x="0" y="0" class="regular" font-size="14" fill="#48484A" text-decoration="line-through">- Cross-attention to the encoder's output</text>
        <rect x="-2" y="10" width="410" height="20" rx="3" fill="#5A92B0" opacity="0.12"/>
        <text x="0" y="25" class="regular" font-size="14" fill="#7ABADC">It checks back to the encoder's understanding of the input</text>
      </g>
    </g>

    <!-- AI response card -->
    <g transform="translate(80, 490)">
      <rect x="0" y="0" width="480" height="56" rx="10" fill="#2C2C30" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="16" y="24" class="regular" font-size="13" fill="#AEAEB2">Done. I've rewritten the section using simpler language.</text>
      <text x="16" y="44" class="regular" font-size="11" fill="#636366">1 pending changes</text>
      <!-- Keep button -->
      <rect x="130" y="32" width="48" height="22" rx="5" fill="rgba(255,255,255,0.08)" stroke="#3A3A3C" stroke-width="1"/>
      <text x="154" y="47" text-anchor="middle" class="medium" font-size="11" fill="#AEAEB2">Keep</text>
      <text x="198" y="47" class="regular" font-size="11" fill="#636366">Undo</text>
      <text x="244" y="47" class="regular" font-size="11" fill="#636366">Try again</text>
    </g>
  </g>
</svg>


