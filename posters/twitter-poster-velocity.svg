<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      .light { font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif; font-weight: 300; }
      .bold { font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif; font-weight: 900; }
      .medium { font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- Bold deep indigo background -->
  <rect width="1200" height="675" fill="#1e1b4b"/>

  <!-- Large decorative circle (top-right) -->
  <circle cx="1050" cy="-40" r="320" fill="#312e81" opacity="0.6"/>
  <!-- Accent shape (bottom-left) -->
  <rect x="-60" y="520" width="300" height="300" rx="40" fill="#3730a3" opacity="0.35" transform="rotate(-15, 90, 670)"/>

  <!-- Logo (white on color) -->
  <g transform="translate(70, 55)">
    <path d="M3 0 Q0 0 0 3 L0 16 L20 20 L16 0 Z" fill="#FFFFFF"/>
    <path d="M24 0 L20 20 L40 16 L40 3 Q40 0 37 0 Z" fill="#FFFFFF"/>
    <path d="M0 24 L20 20 L16 40 L3 40 Q0 40 0 37 Z" fill="#FFFFFF"/>
    <path d="M20 20 L40 24 L40 37 Q40 40 37 40 L24 40 Z" fill="#FFFFFF"/>
    <text x="52" y="30" fill="#FFFFFF" font-size="24" letter-spacing="-1">
      <tspan class="light">do</tspan><tspan class="bold">X</tspan><tspan class="light">mind</tspan>
    </text>
  </g>

  <!-- Bold headline -->
  <text x="70" y="185" class="bold" font-size="64" fill="#FFFFFF" letter-spacing="-3">8 updates.</text>
  <text x="70" y="255" class="bold" font-size="64" fill="#FFFFFF" letter-spacing="-3">6 weeks.</text>

  <!-- Subtitle -->
  <text x="70" y="300" class="light" font-size="18" fill="rgba(255,255,255,0.5)">Everything we shipped since launch.</text>

  <!-- Fanned stack of feature cards — oversized, overlapping, dynamic -->
  <!-- Card 8 (back, most rotated) -->
  <g transform="translate(540, 100) rotate(-8, 200, 200)">
    <rect x="0" y="0" width="400" height="68" rx="14" fill="#0f0e26" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="68" rx="3" fill="#ef4444"/>
    <text x="28" y="42" class="medium" font-size="18" fill="rgba(255,255,255,0.7)">CSV Analysis</text>
  </g>

  <!-- Card 7 -->
  <g transform="translate(555, 135) rotate(-5.5, 200, 180)">
    <rect x="0" y="0" width="400" height="68" rx="14" fill="#0f0e26" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="68" rx="3" fill="#14b8a6"/>
    <text x="28" y="42" class="medium" font-size="18" fill="rgba(255,255,255,0.75)">KB Agent</text>
  </g>

  <!-- Card 6 -->
  <g transform="translate(565, 175) rotate(-3.5, 200, 160)">
    <rect x="0" y="0" width="400" height="68" rx="14" fill="#110f2a" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="68" rx="3" fill="#ec4899"/>
    <text x="28" y="42" class="medium" font-size="18" fill="rgba(255,255,255,0.8)">14 Writer Themes</text>
  </g>

  <!-- Card 5 -->
  <g transform="translate(570, 220) rotate(-2, 200, 140)">
    <rect x="0" y="0" width="400" height="68" rx="14" fill="#110f2a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="68" rx="3" fill="#f59e0b"/>
    <text x="28" y="42" class="medium" font-size="18" fill="rgba(255,255,255,0.85)">Community Hub</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(575, 270) rotate(-0.5, 200, 120)">
    <rect x="0" y="0" width="400" height="68" rx="14" fill="#13102e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="68" rx="3" fill="#22c55e"/>
    <text x="28" y="42" class="medium" font-size="18" fill="rgba(255,255,255,0.85)">Presentation Mode</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(578, 325) rotate(0.5, 200, 100)">
    <rect x="0" y="0" width="400" height="68" rx="14" fill="#141131" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="68" rx="3" fill="#6366f1"/>
    <text x="28" y="42" class="medium" font-size="18" fill="rgba(255,255,255,0.9)">Inline Comments</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(580, 385) rotate(1, 200, 80)">
    <rect x="0" y="0" width="400" height="68" rx="14" fill="#151233" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="68" rx="3" fill="#3b82f6"/>
    <text x="28" y="42" class="medium" font-size="18" fill="#FFFFFF">Database Blocks</text>
  </g>

  <!-- Card 1 (front, most prominent) -->
  <g transform="translate(582, 448) rotate(1.5, 200, 60)">
    <rect x="0" y="0" width="400" height="68" rx="14" fill="#16133a" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="68" rx="3" fill="#8b5cf6"/>
    <text x="28" y="42" class="bold" font-size="18" fill="#FFFFFF">Thinking Mode</text>
    <rect x="310" y="20" width="60" height="26" rx="13" fill="#8b5cf6" opacity="0.2"/>
    <text x="340" y="38" class="medium" font-size="11" fill="#8b5cf6" text-anchor="middle">NEW</text>
  </g>

  <!-- Footer -->
  <text x="70" y="620" class="light" font-size="20" fill="rgba(255,255,255,0.35)">doxmind.com</text>
</svg>