<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <style>
      .light { font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif; font-weight: 300; }
      .bold { font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif; font-weight: 900; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="#000000"/>

  <!-- Logo (Top Left) -->
  <g transform="translate(50, 40)">
    <!-- Icon -->
    <g>
      <path d="M3 0 Q0 0 0 3 L0 16 L20 20 L16 0 Z" fill="#FFFFFF"/>
      <path d="M24 0 L20 20 L40 16 L40 3 Q40 0 37 0 Z" fill="#FFFFFF"/>
      <path d="M0 24 L20 20 L16 40 L3 40 Q0 40 0 37 Z" fill="#FFFFFF"/>
      <path d="M20 20 L40 24 L40 37 Q40 40 37 40 L24 40 Z" fill="#FFFFFF"/>
    </g>
    <!-- Wordmark -->
    <text x="52" y="30" fill="#FFFFFF" font-size="24" letter-spacing="-1">
      <tspan class="light">do</tspan><tspan class="bold">X</tspan><tspan class="light">mind</tspan>
    </text>
  </g>

  <!-- Main Content (Centered) -->
  <g transform="translate(600, 290)">
    <!-- Headline -->
    <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" font-size="72" letter-spacing="-3">
      <tspan class="bold">Think.</tspan><tspan class="light"> Write. </tspan><tspan class="bold">Publish.</tspan>
    </text>
    <!-- Subtext -->
    <text x="0" y="70" text-anchor="middle" fill="#999999" font-size="24" letter-spacing="0">
      <tspan class="light">The AI editor that reasons with you.</tspan>
    </text>
  </g>

  <!-- Footer (Bottom Center) -->
  <text x="600" y="590" text-anchor="middle" fill="#666666" font-size="13" letter-spacing="2">
    <tspan class="light">DOXMIND.COM</tspan>
  </text>

</svg>
