<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760">
  <defs>
    <style>
      .light { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 300; }
      .regular { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; }
      .medium { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .bold { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <rect width="1270" height="760" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="635" y="52" text-anchor="middle" class="bold" font-size="30" fill="#111827" letter-spacing="-1">Mind Map View</text>

  <!-- App Window -->
  <g transform="translate(75, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="1120" height="580" rx="12" fill="#1C1C1E"/>

    <!-- Titlebar -->
    <rect x="0" y="0" width="1120" height="36" rx="12" fill="#28282C"/>
    <rect x="0" y="12" width="1120" height="24" fill="#28282C"/>
    <circle cx="18" cy="18" r="4.5" fill="#ff5f57"/>
    <circle cx="34" cy="18" r="4.5" fill="#febc2e"/>
    <circle cx="50" cy="18" r="4.5" fill="#28c840"/>

    <!-- Grid dots background -->
    <rect x="1" y="36" width="1118" height="543" fill="url(#dots)"/>

    <!-- Left toolbar -->
    <g transform="translate(14, 56)">
      <rect x="0" y="0" width="26" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
      <line x1="8" y1="13" x2="18" y2="13" stroke="#48484A" stroke-width="1.3"/>
      <line x1="13" y1="8" x2="13" y2="18" stroke="#48484A" stroke-width="1.3"/>
      <rect x="0" y="32" width="26" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
      <line x1="8" y1="45" x2="18" y2="45" stroke="#48484A" stroke-width="1.3"/>
      <rect x="0" y="64" width="26" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
      <rect x="6" y="70" width="14" height="14" rx="2" fill="none" stroke="#48484A" stroke-width="1.2"/>
    </g>

    <!-- Top-right controls -->
    <g transform="translate(1028, 48)">
      <rect x="0" y="0" width="24" height="24" rx="5" fill="rgba(255,255,255,0.04)"/>
      <rect x="30" y="0" width="24" height="24" rx="5" fill="rgba(255,255,255,0.04)"/>
      <rect x="60" y="0" width="24" height="24" rx="5" fill="rgba(255,255,255,0.04)"/>
    </g>

    <!-- ==================== MIND MAP ==================== -->

    <!-- Connecting lines -->
    <!-- Root→down -->
    <line x1="560" y1="268" x2="560" y2="330" stroke="#D4A54A" stroke-width="1.5" opacity="0.25"/>
    <!-- Horizontal bar -->
    <line x1="82" y1="330" x2="1038" y2="330" stroke="#D4A54A" stroke-width="1.5" opacity="0.15"/>
    <!-- Down to each child -->
    <line x1="82" y1="330" x2="82" y2="370" stroke="#D4A54A" stroke-width="1.5" opacity="0.15"/>
    <line x1="242" y1="330" x2="242" y2="370" stroke="#D4A54A" stroke-width="1.5" opacity="0.15"/>
    <line x1="420" y1="330" x2="420" y2="370" stroke="#D4A54A" stroke-width="1.5" opacity="0.15"/>
    <line x1="560" y1="330" x2="560" y2="370" stroke="#D4A54A" stroke-width="1.5" opacity="0.15"/>
    <line x1="720" y1="330" x2="720" y2="370" stroke="#D4A54A" stroke-width="1.5" opacity="0.15"/>
    <line x1="880" y1="330" x2="880" y2="370" stroke="#D4A54A" stroke-width="1.5" opacity="0.15"/>
    <line x1="1038" y1="330" x2="1038" y2="370" stroke="#D4A54A" stroke-width="1.5" opacity="0.15"/>

    <!-- ROOT NODE -->
    <g transform="translate(470, 228)">
      <rect x="0" y="0" width="180" height="40" rx="8" fill="#28282C" stroke="#D4A54A" stroke-width="1.5" opacity="0.9"/>
      <path d="M14,16 L18,22 L22,16" stroke="#636366" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <text x="32" y="25" class="medium" font-size="12" fill="#D4A54A">Customer Database An...</text>
    </g>

    <!-- CHILD NODES -->
    <g transform="translate(18, 370)">
      <rect x="0" y="0" width="128" height="36" rx="7" fill="#28282C" stroke="#D4A54A" stroke-width="1" opacity="0.5"/>
      <text x="12" y="22" class="regular" font-size="11" fill="#D4A54A" opacity="0.7">Dataset Overview</text>
    </g>

    <g transform="translate(164, 370)">
      <rect x="0" y="0" width="156" height="36" rx="7" fill="#28282C" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="12" y="22" class="regular" font-size="11" fill="#8E8E93">1. Customer Segment...</text>
    </g>

    <g transform="translate(336, 370)">
      <rect x="0" y="0" width="168" height="36" rx="7" fill="#28282C" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="12" y="22" class="regular" font-size="11" fill="#8E8E93">2. Loyalty Points by Se...</text>
    </g>

    <g transform="translate(520, 370)">
      <rect x="0" y="0" width="180" height="36" rx="7" fill="#28282C" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="12" y="22" class="regular" font-size="11" fill="#8E8E93">3. Preferred Contact M...</text>
    </g>

    <g transform="translate(640, 370)">
      <rect x="0" y="0" width="160" height="36" rx="7" fill="#28282C" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="12" y="22" class="regular" font-size="11" fill="#8E8E93">4. Registration Trends...</text>
    </g>

    <g transform="translate(816, 370)">
      <rect x="0" y="0" width="170" height="36" rx="7" fill="#28282C" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="12" y="22" class="regular" font-size="11" fill="#8E8E93">5. Geographic Distribu...</text>
    </g>

    <g transform="translate(980, 370)">
      <rect x="0" y="0" width="100" height="36" rx="7" fill="#28282C" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="12" y="22" class="regular" font-size="11" fill="#8E8E93">Summary</text>
    </g>

    <!-- Help text -->
    <text x="560" y="550" text-anchor="middle" class="regular" font-size="11" fill="#3A3A3C">Click to select · Double-click to go · Space to collapse · ↑↓ Navigate</text>

    <!-- Mini-map -->
    <g transform="translate(1040, 490)">
      <rect x="0" y="0" width="64" height="40" rx="4" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <line x1="14" y1="14" x2="50" y2="14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="14" y1="20" x2="50" y2="20" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="14" y1="26" x2="40" y2="26" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </g>
  </g>
</svg>


