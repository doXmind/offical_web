<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760">
  <defs>
    <style>
      .light { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 300; }
      .regular { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; }
      .medium { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .bold { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1270" height="760" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="635" y="52" text-anchor="middle" class="bold" font-size="30" fill="#111827" letter-spacing="-1">Presentation Mode</text>

  <!-- Presentation Window -->
  <g transform="translate(75, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="1120" height="580" rx="12" fill="#1C1C1E"/>

    <!-- Titlebar -->
    <rect x="0" y="0" width="1120" height="36" rx="12" fill="#28282C"/>
    <rect x="0" y="12" width="1120" height="24" fill="#28282C"/>
    <circle cx="18" cy="18" r="4.5" fill="#ff5f57"/>
    <circle cx="34" cy="18" r="4.5" fill="#febc2e"/>
    <circle cx="50" cy="18" r="4.5" fill="#28c840"/>

    <!-- Top-right toolbar -->
    <g transform="translate(960, 50)">
      <rect x="0" y="0" width="34" height="24" rx="5" fill="rgba(255,255,255,0.04)"/>
      <text x="10" y="16" class="medium" font-size="9" fill="#636366">AI</text>
      <rect x="40" y="0" width="24" height="24" rx="5" fill="rgba(255,255,255,0.04)"/>
      <line x1="48" y1="8" x2="58" y2="8" stroke="#48484A" stroke-width="1.2"/>
      <line x1="48" y1="13" x2="58" y2="13" stroke="#48484A" stroke-width="1.2"/>
      <line x1="48" y1="18" x2="55" y2="18" stroke="#48484A" stroke-width="1.2"/>
      <rect x="70" y="0" width="24" height="24" rx="5" fill="rgba(255,255,255,0.04)"/>
      <rect x="100" y="0" width="42" height="24" rx="5" fill="rgba(255,255,255,0.04)"/>
      <text x="108" y="16" class="regular" font-size="9" fill="#48484A">× ESC</text>
    </g>

    <!-- Slide content -->
    <g transform="translate(200, 120)">
      <text x="0" y="30" class="bold" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">1. Customer Segment Distribution</text>

      <!-- Data table -->
      <g transform="translate(0, 70)">
        <rect x="0" y="0" width="660" height="230" rx="0" fill="transparent" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

        <!-- Header -->
        <rect x="1" y="1" width="658" height="40" fill="rgba(255,255,255,0.03)"/>
        <text x="28" y="26" class="bold" font-size="14" fill="#AEAEB2">Segment</text>
        <text x="270" y="26" class="bold" font-size="14" fill="#AEAEB2">Count</text>
        <text x="470" y="26" class="bold" font-size="14" fill="#AEAEB2">Percentage</text>
        <line x1="0" y1="41" x2="660" y2="41" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

        <!-- Row 1 -->
        <text x="28" y="72" class="regular" font-size="14" fill="#AEAEB2">Premium</text>
        <text x="270" y="72" class="regular" font-size="14" fill="#AEAEB2">2,553</text>
        <text x="470" y="72" class="regular" font-size="14" fill="#AEAEB2">25.5%</text>
        <line x1="20" y1="86" x2="640" y2="86" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

        <!-- Row 2 -->
        <text x="28" y="116" class="regular" font-size="14" fill="#AEAEB2">VIP</text>
        <text x="270" y="116" class="regular" font-size="14" fill="#AEAEB2">2,493</text>
        <text x="470" y="116" class="regular" font-size="14" fill="#AEAEB2">24.9%</text>
        <line x1="20" y1="130" x2="640" y2="130" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

        <!-- Row 3 -->
        <text x="28" y="160" class="regular" font-size="14" fill="#AEAEB2">New</text>
        <text x="270" y="160" class="regular" font-size="14" fill="#AEAEB2">2,485</text>
        <text x="470" y="160" class="regular" font-size="14" fill="#AEAEB2">24.8%</text>
        <line x1="20" y1="174" x2="640" y2="174" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

        <!-- Row 4 -->
        <text x="28" y="204" class="regular" font-size="14" fill="#AEAEB2">Regular</text>
        <text x="270" y="204" class="regular" font-size="14" fill="#AEAEB2">2,469</text>
        <text x="470" y="204" class="regular" font-size="14" fill="#AEAEB2">24.7%</text>
      </g>

      <!-- Key Finding -->
      <text x="0" y="340" class="medium" font-size="13" fill="#8E8E93">Key Finding:</text>
      <text x="100" y="340" class="regular" font-size="13" fill="#636366">Segments are nearly evenly distributed (~25% each), indicating a balanced portfolio.</text>
    </g>

    <!-- Navigation arrows -->
    <g transform="translate(26, 276)">
      <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.04)"/>
      <path d="M20,10 L14,16 L20,22" stroke="#48484A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(1070, 276)">
      <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.04)"/>
      <path d="M12,10 L18,16 L12,22" stroke="#48484A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Slide counter -->
    <text x="560" y="550" text-anchor="middle" class="regular" font-size="13" fill="#48484A">3 / 8</text>

    <!-- Progress bar -->
    <rect x="0" y="574" width="1120" height="6" rx="3" fill="rgba(255,255,255,0.02)"/>
    <rect x="0" y="574" width="420" height="6" rx="3" fill="#8B8EC8" opacity="0.25"/>
  </g>
</svg>


