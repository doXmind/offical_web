      <g transform="translate(0, 148)">
        <rect x="0" y="0" width="78" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="10" y="17" class="regular" font-size="10" fill="#636366">investing 11</text>

        <rect x="86" y="0" width="44" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="96" y="17" class="regular" font-size="10" fill="#636366">ai 10</text>

        <rect x="138" y="0" width="62" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="148" y="17" class="regular" font-size="10" fill="#636366">career 10</text>

        <rect x="208" y="0" width="68" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="218" y="17" class="regular" font-size="10" fill="#636366">finance 10</text>

        <rect x="0" y="34" width="106" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="10" y="51" class="regular" font-size="10" fill="#636366">communication</text>

        <rect x="114" y="34" width="80" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="124" y="51" class="regular" font-size="10" fill="#636366">education</text>

        <rect x="202" y="34" width="74" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="212" y="51" class="regular" font-size="10" fill="#636366">learning</text>

        <rect x="0" y="68" width="116" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="10" y="85" class="regular" font-size="10" fill="#636366">entrepreneurship</text>

        <rect x="124" y="68" width="60" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="134" y="85" class="regular" font-size="10" fill="#636366">fitness</text>

        <rect x="192" y="68" width="62" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="202" y="85" class="regular" font-size="10" fill="#636366">health</text>

        <rect x="0" y="102" width="90" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="10" y="119" class="regular" font-size="10" fill="#636366">productivity</text>

        <rect x="98" y="102" width="86" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="108" y="119" class="regular" font-size="10" fill="#636366">tech-trends</text>

        <rect x="192" y="102" width="86" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="202" y="119" class="regular" font-size="10" fill="#636366">technology</text>

        <rect x="0" y="136" width="82" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="10" y="153" class="regular" font-size="10" fill="#636366">side-hustle</text>

        <rect x="90" y="136" width="74" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="100" y="153" class="regular" font-size="10" fill="#636366">soft-skills</text>

        <rect x="172" y="136" width="72" height="26" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        <text x="182" y="153" class="regular" font-size="10" fill="#636366">wellness</text>
      </g>
    </g>
  </g>
</svg>


