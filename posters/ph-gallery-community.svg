      <text x="0" y="38" class="regular" font-size="12" fill="#636366">Discover, fork, and build on documents</text>
      <text x="0" y="54" class="regular" font-size="12" fill="#636366">shared by writers.</text>

      <line x1="0" y1="70" x2="360" y2="70" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
