<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760">
  <defs>
    <style>
      .light { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 300; }
      .regular { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; }
      .medium { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .bold { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; }
    </style>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1270" height="760" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="635" y="52" text-anchor="middle" class="bold" font-size="30" fill="#111827" letter-spacing="-1">AI Thinking &amp; Tool Use</text>

  <!-- App Window -->
  <g transform="translate(55, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="1160" height="580" rx="12" fill="#1C1C1E"/>

    <!-- Titlebar -->
    <rect x="0" y="0" width="1160" height="40" rx="12" fill="#28282C"/>
    <rect x="0" y="12" width="1160" height="28" fill="#28282C"/>
    <circle cx="20" cy="20" r="5.5" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="5.5" fill="#febc2e"/>
    <circle cx="60" cy="20" r="5.5" fill="#28c840"/>

    <!-- === LEFT: Document Area === -->
    <g transform="translate(40, 60)">
      <text x="0" y="24" class="bold" font-size="22" fill="#F2F2F7">NASDAQ Market Report</text>
      <text x="0" y="48" class="regular" font-size="13" fill="#636366">February 25, 2026</text>

      <!-- Market Summary section -->
      <text x="0" y="84" class="bold" font-size="17" fill="#AEAEB2">Market Summary</text>
      <text x="0" y="108" class="regular" font-size="12" fill="#8E8E93">U.S. stocks closed higher on Tuesday, February 25, 2026,</text>
      <text x="0" y="124" class="regular" font-size="12" fill="#8E8E93">boosted by positive labor market and economic reports.</text>

      <!-- Key Index Performance table -->
      <text x="0" y="160" class="bold" font-size="15" fill="#AEAEB2">Key Index Performance</text>

      <g transform="translate(0, 174)">
        <rect x="0" y="0" width="480" height="28" fill="rgba(255,255,255,0.03)"/>
        <text x="12" y="18" class="medium" font-size="10" fill="#8E8E93">Index</text>
        <text x="200" y="18" class="medium" font-size="10" fill="#8E8E93">Change</text>
        <text x="280" y="18" class="medium" font-size="10" fill="#8E8E93">Points</text>
        <text x="370" y="18" class="medium" font-size="10" fill="#8E8E93">Closing Value</text>
        <line x1="0" y1="28" x2="480" y2="28" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

        <text x="12" y="48" class="regular" font-size="11" fill="#8E8E93">Dow Jones Industrial Avg</text>
        <text x="200" y="48" class="regular" font-size="11" fill="#5EC28A">+0.8%</text>
        <text x="280" y="48" class="regular" font-size="11" fill="#8E8E93">+370.44</text>
        <text x="370" y="48" class="regular" font-size="11" fill="#8E8E93">49,174.50</text>
        <line x1="0" y1="56" x2="480" y2="56" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

        <text x="12" y="76" class="regular" font-size="11" fill="#8E8E93">NASDAQ Composite</text>
        <text x="200" y="76" class="regular" font-size="11" fill="#5EC28A">+1.1%</text>
        <text x="280" y="76" class="regular" font-size="11" fill="#8E8E93">+236.41</text>
        <text x="370" y="76" class="regular" font-size="11" fill="#8E8E93">22,863.68</text>
        <line x1="0" y1="84" x2="480" y2="84" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

        <text x="12" y="104" class="regular" font-size="11" fill="#8E8E93">S&amp;P 500</text>
        <text x="200" y="104" class="regular" font-size="11" fill="#5EC28A">+0.8%</text>
        <text x="280" y="104" class="regular" font-size="11" fill="#8E8E93">—</text>
        <text x="370" y="104" class="regular" font-size="11" fill="#8E8E93">6,890.07</text>
      </g>

      <!-- Bar chart placeholder -->
      <g transform="translate(40, 320)">
        <text x="160" y="0" text-anchor="middle" class="medium" font-size="11" fill="#636366">Major Indices Performance (Feb 25, 2026)</text>

        <!-- Y-axis -->
        <line x1="0" y1="14" x2="0" y2="150" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <line x1="0" y1="150" x2="340" y2="150" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="-6" y="30" text-anchor="end" class="regular" font-size="8" fill="#3A3A3C">1.2</text>
        <text x="-6" y="60" text-anchor="end" class="regular" font-size="8" fill="#3A3A3C">1.0</text>
        <text x="-6" y="90" text-anchor="end" class="regular" font-size="8" fill="#3A3A3C">0.8</text>
        <text x="-6" y="120" text-anchor="end" class="regular" font-size="8" fill="#3A3A3C">0.6</text>

        <!-- Bars -->
        <rect x="30" y="70" width="60" height="80" rx="2" fill="#6b7280" opacity="0.45"/>
        <rect x="140" y="34" width="60" height="116" rx="2" fill="#6b7280" opacity="0.45"/>
        <rect x="250" y="72" width="60" height="78" rx="2" fill="#6b7280" opacity="0.45"/>

        <!-- X labels -->
        <text x="60" y="166" text-anchor="middle" class="regular" font-size="9" fill="#3A3A3C">Dow Jones</text>
        <text x="170" y="166" text-anchor="middle" class="regular" font-size="9" fill="#3A3A3C">NASDAQ</text>
        <text x="280" y="166" text-anchor="middle" class="regular" font-size="9" fill="#3A3A3C">S&amp;P 500</text>
      </g>
    </g>

    <!-- Divider -->
    <line x1="580" y1="40" x2="580" y2="580" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <!-- === RIGHT: AI Chat Panel === -->
    <rect x="580" y="40" width="580" height="540" fill="#1C1C1E"/>
    <text x="604" y="68" class="medium" font-size="13" fill="#8E8E93">AI Chat</text>

    <!-- User message -->
    <g transform="translate(604, 88)">
      <circle cx="10" cy="10" r="10" fill="#3b2a1a"/>
      <text x="10" y="14" text-anchor="middle" class="medium" font-size="9" fill="#fff">Y</text>
      <text x="28" y="14" class="medium" font-size="11" fill="#AEAEB2">You</text>
      <text x="0" y="38" class="regular" font-size="13" fill="#AEAEB2">add some necessary charts</text>
    </g>

    <!-- AI response -->
    <g transform="translate(604, 150)">
      <!-- doXmind logo -->
      <g transform="scale(0.35)">
        <path d="M3 0 Q0 0 0 3 L0 16 L20 20 L16 0 Z" fill="#AEAEB2"/>
        <path d="M24 0 L20 20 L40 16 L40 3 Q40 0 37 0 Z" fill="#AEAEB2"/>
        <path d="M0 24 L20 20 L16 40 L3 40 Q0 40 0 37 Z" fill="#AEAEB2"/>
        <path d="M20 20 L40 24 L40 37 Q40 40 37 40 L24 40 Z" fill="#AEAEB2"/>
      </g>
      <text x="22" y="12" class="medium" font-size="11" fill="#AEAEB2">doXmind</text>

      <text x="0" y="34" class="regular" font-size="12" fill="#AEAEB2">Done! I've added the following charts to</text>
      <text x="0" y="50" class="regular" font-size="12" fill="#AEAEB2">your NASDAQ Market Report:</text>

      <!-- Tool use results - numbered list -->
      <g transform="translate(0, 70)">
        <!-- Item 1 -->
        <text x="0" y="0" class="regular" font-size="11" fill="#636366">1.</text>
        <text x="16" y="0" class="medium" font-size="11" fill="#AEAEB2">Major Indices Performance</text>
        <text x="196" y="0" class="regular" font-size="11" fill="#636366">(bar chart)</text>
        <text x="24" y="16" class="regular" font-size="10" fill="#636366">Shows Dow Jones, NASDAQ, and S&amp;P 500</text>

        <!-- Item 2 -->
        <text x="0" y="40" class="regular" font-size="11" fill="#636366">2.</text>
        <text x="16" y="40" class="medium" font-size="11" fill="#AEAEB2">Sector Performance</text>
        <text x="144" y="40" class="regular" font-size="11" fill="#636366">(pie chart)</text>
        <text x="24" y="56" class="regular" font-size="10" fill="#636366">Positive vs Negative sectors split</text>

        <!-- Item 3 -->
        <text x="0" y="80" class="regular" font-size="11" fill="#636366">3.</text>
        <text x="16" y="80" class="medium" font-size="11" fill="#AEAEB2">Top Sectors by Performance</text>
        <text x="200" y="80" class="regular" font-size="11" fill="#636366">(pie chart)</text>
        <text x="24" y="96" class="regular" font-size="10" fill="#636366">Top gaining sectors</text>

        <!-- Item 4 -->
        <text x="0" y="120" class="regular" font-size="11" fill="#636366">4.</text>
        <text x="16" y="120" class="medium" font-size="11" fill="#AEAEB2">Weekly Job Growth Trend</text>
        <text x="178" y="120" class="regular" font-size="11" fill="#636366">(bar chart)</text>
        <text x="24" y="136" class="regular" font-size="10" fill="#636366">Employment growth over 3 weeks</text>

        <!-- Item 5 -->
        <text x="0" y="160" class="regular" font-size="11" fill="#636366">5.</text>
        <text x="16" y="160" class="medium" font-size="11" fill="#AEAEB2">Consumer Confidence Index</text>
        <text x="198" y="160" class="regular" font-size="11" fill="#636366">(bar chart)</text>
        <text x="24" y="176" class="regular" font-size="10" fill="#636366">January vs Forecast vs February</text>

        <!-- Item 6 -->
        <text x="0" y="200" class="regular" font-size="11" fill="#636366">6.</text>
        <text x="16" y="200" class="medium" font-size="11" fill="#AEAEB2">Top Stock Movers</text>
        <text x="136" y="200" class="regular" font-size="11" fill="#636366">(bar chart)</text>
        <text x="24" y="216" class="regular" font-size="10" fill="#636366">Top 6 gaining stocks with % changes</text>
      </g>

      <!-- Mermaid note -->
      <text x="0" y="306" class="regular" font-size="11" fill="#636366">All charts use Mermaid syntax and will</text>
      <text x="0" y="322" class="regular" font-size="11" fill="#636366">render automatically in the document viewer.</text>

      <!-- Action icons -->
      <g transform="translate(0, 340)">
        <rect x="0" y="0" width="18" height="16" rx="3" fill="rgba(255,255,255,0.04)"/>
        <rect x="24" y="0" width="18" height="16" rx="3" fill="rgba(255,255,255,0.04)"/>
        <rect x="48" y="0" width="18" height="16" rx="3" fill="rgba(255,255,255,0.04)"/>
        <rect x="72" y="0" width="18" height="16" rx="3" fill="rgba(255,255,255,0.04)"/>
      </g>
    </g>

    <!-- Thinking indicator + input bar -->
    <g transform="translate(604, 520)">
      <rect x="0" y="0" width="530" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <text x="14" y="22" class="regular" font-size="12" fill="#48484A">Ask AI anything, @ to mention file</text>

      <!-- Thinking pill -->
      <rect x="380" y="6" width="90" height="24" rx="12" fill="#D4A54A" opacity="0.12"/>
      <circle cx="398" cy="18" r="3.5" fill="#D4A54A" opacity="0.6"/>
      <text x="408" y="22" class="medium" font-size="10" fill="#D4A54A" opacity="0.8">Thinking</text>

      <!-- + button -->
      <text x="540" y="22" class="regular" font-size="16" fill="#48484A">+</text>
    </g>
  </g>
</svg>
