<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Gradient for glow effect -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#333333" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Glow filter for logo -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow for accent -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>

    <!-- Perspective lines -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333" stop-opacity="0"/>
      <stop offset="50%" stop-color="#444" stop-opacity="1"/>
      <stop offset="100%" stop-color="#333" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#000000"/>
  <rect width="1280" height="720" fill="url(#centerGlow)"/>

  <!-- Grid overlay -->
  <rect width="1280" height="720" fill="url(#grid)" opacity="0.4"/>

  <!-- Perspective converging lines -->
  <g opacity="0.3">
    <line x1="0" y1="720" x2="640" y2="360" stroke="url(#lineGrad)" stroke-width="1"/>
    <line x1="1280" y1="720" x2="640" y2="360" stroke="url(#lineGrad)" stroke-width="1"/>
    <line x1="0" y1="0" x2="640" y2="360" stroke="url(#lineGrad)" stroke-width="1"/>
    <line x1="1280" y1="0" x2="640" y2="360" stroke="url(#lineGrad)" stroke-width="1"/>
    <line x1="0" y1="360" x2="1280" y2="360" stroke="url(#lineGrad)" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="720" stroke="url(#lineGrad)" stroke-width="1"/>
  </g>

  <!-- Decorative floating particles -->
  <g opacity="0.6">
    <circle cx="200" cy="150" r="2" fill="#fff"/>
    <circle cx="1100" cy="200" r="3" fill="#fff"/>
    <circle cx="150" cy="500" r="2" fill="#fff"/>
    <circle cx="1150" cy="550" r="2" fill="#fff"/>
    <circle cx="300" cy="600" r="1.5" fill="#fff"/>
    <circle cx="1000" cy="120" r="1.5" fill="#fff"/>
    <circle cx="400" cy="100" r="2" fill="#fff"/>
    <circle cx="900" cy="620" r="2" fill="#fff"/>
  </g>

  <!-- Main Logo Icon - Large, centered, with glow -->
  <g transform="translate(540, 200)" filter="url(#glow)">
    <!-- X Icon - 200x200 -->
    <path d="M15 0 Q0 0 0 15 L0 80 L100 100 L80 0 Z" fill="#FFFFFF"/>
    <path d="M120 0 L100 100 L200 80 L200 15 Q200 0 185 0 Z" fill="#FFFFFF"/>
    <path d="M0 120 L100 100 L80 200 L15 200 Q0 200 0 185 Z" fill="#FFFFFF"/>
    <path d="M100 100 L200 120 L200 185 Q200 200 185 200 L120 200 Z" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark below icon -->
  <text x="640" y="480" text-anchor="middle" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="80" fill="#FFFFFF" letter-spacing="-3" filter="url(#glow)">
    <tspan font-weight="300">do</tspan><tspan font-weight="900">X</tspan><tspan font-weight="300">mind</tspan>
  </text>

  <!-- Tagline -->
  <text x="640" y="540" text-anchor="middle" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#888888" letter-spacing="6" font-weight="400">
    THE AI EDITOR THAT REASONS WITH YOU
  </text>

  <!-- "AI Powered" badge -->
  <g transform="translate(1050, 50)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#FFFFFF" opacity="0.1"/>
    <rect x="0" y="0" width="180" height="40" rx="20" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
    <text x="90" y="27" text-anchor="middle" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#FFFFFF" letter-spacing="2" font-weight="600">
      POWERED BY AI
    </text>
  </g>

  <!-- Play button hint (subtle) -->
  <g transform="translate(590, 620)" opacity="0.5">
    <circle cx="50" cy="25" r="25" fill="none" stroke="#fff" stroke-width="2"/>
    <polygon points="45,15 45,35 60,25" fill="#fff"/>
    <text x="90" y="32" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#FFFFFF" letter-spacing="1">
      WATCH DEMO
    </text>
  </g>

  <!-- Corner accent lines -->
  <g stroke="#FFFFFF" stroke-width="2" opacity="0.2">
    <!-- Top left -->
    <line x1="0" y1="60" x2="60" y2="60"/>
    <line x1="60" y1="0" x2="60" y2="60"/>
    <!-- Top right -->
    <line x1="1280" y1="60" x2="1220" y2="60"/>
    <line x1="1220" y1="0" x2="1220" y2="60"/>
    <!-- Bottom left -->
    <line x1="0" y1="660" x2="60" y2="660"/>
    <line x1="60" y1="720" x2="60" y2="660"/>
    <!-- Bottom right -->
    <line x1="1280" y1="660" x2="1220" y2="660"/>
    <line x1="1220" y1="720" x2="1220" y2="660"/>
  </g>
</svg>
