<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Subtle gradient overlay -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.05" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.02" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative glow -->
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#glowGradient)"/>

  <!-- doXmind X-Icon Logo (centered, larger) -->
  <g transform="translate(500, 165)">
    <!-- Top-left quadrant -->
    <path d="M12 0 Q0 0 0 12 L0 64 L80 80 L64 0 Z" fill="#FFFFFF"/>
    <!-- Top-right quadrant -->
    <path d="M96 0 L80 80 L160 64 L160 12 Q160 0 148 0 Z" fill="#FFFFFF"/>
    <!-- Bottom-left quadrant -->
    <path d="M0 96 L80 80 L64 160 L12 160 Q0 160 0 148 Z" fill="#FFFFFF"/>
    <!-- Bottom-right quadrant -->
    <path d="M80 80 L160 96 L160 148 Q160 160 148 160 L96 160 Z" fill="#FFFFFF"/>
  </g>

  <!-- Brand name: doXmind -->
  <text x="600" y="400" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    <tspan font-weight="300">do</tspan><tspan font-weight="900">X</tspan><tspan font-weight="300">mind</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="460" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" fill="#888888" text-anchor="middle" letter-spacing="4">
    AI-Native Desktop Editor
  </text>

  <!-- Subtitle -->
  <text x="600" y="510" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#555555" text-anchor="middle" letter-spacing="2">
    Think. Write. Publish.
  </text>

  <!-- Bottom URL -->
  <text x="600" y="590" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#444444" text-anchor="middle" letter-spacing="1">
    doxmind.com
  </text>

  <!-- Decorative border -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#222222" stroke-width="1" rx="8"/>
</svg>
